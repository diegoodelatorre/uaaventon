<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Registro UAAventon</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre(s)</label>
        <input formControlName="first_name" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Apellidos</label>
        <input formControlName="last_name" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Correo Institucional</label>
        <input formControlName="uaa_email" type="email" placeholder="ejemplo@edu.uaa.mx" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        <span *ngIf="registerForm.get('uaa_email')?.hasError('nonInstitutionalEmail') && registerForm.get('uaa_email')?.touched" class="text-red-500 text-xs">
          Debe ser un correo &#64;edu.uaa.mx
        </span>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input formControlName="password" type="password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:opacity-50">
        Registrarse
      </button>

      <div *ngIf="successMessage" class="mt-4 p-2 bg-green-100 text-green-700 text-center rounded">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="mt-4 p-2 bg-red-100 text-red-700 text-center rounded">{{ errorMessage }}</div>
    </form>
  </div>
</div>
