<div class="min-h-screen bg-[#F4F8FC] p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6 border border-[#F8FAFC]">
    
    <div class="flex justify-between items-center border-b pb-4 mb-6">
      <h1 class="text-2xl font-bold text-[#00468C]">Panel de UAAventón</h1>
      <button 
        (click)="logout()"
        class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
      >
        Cerrar Sesión
      </button>
    </div>

    <div class="text-center py-10">
      <h2 class="text-xl text-gray-700">¡Bienvenido al sistema!</h2>
      <p class="text-gray-500 mt-2">Has iniciado sesión correctamente y el Token JWT está activo.</p>
      
      @if (isDriver) {
        <div class="mt-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg inline-block">
          Modo Conductor Activado 🚗
        </div>
      } @else {
        <div class="mt-6 p-4 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg inline-block">
          Modo Pasajero Activado 🎒
        </div>
      }
    </div>

  </div>
</div>
