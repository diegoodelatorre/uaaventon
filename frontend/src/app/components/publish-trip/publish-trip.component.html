<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-center text-blue-900 mb-2">Publicar un Viaje</h2>
    <p class="text-center text-gray-500 mb-6">Ofrece asientos disponibles y ayuda a otros estudiantes.</p>
    
    <form [formGroup]="tripForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Punto de Origen</label>
          <input formControlName="origin_point" type="text" placeholder="Ej. Altaria" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Punto de Destino</label>
          <input formControlName="destination_point" type="text" placeholder="Ej. UAA - Campus Sur" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Fecha y Hora de Salida</label>
        <input formControlName="departure_datetime" type="datetime-local" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Asientos Disponibles</label>
          <input formControlName="total_seats" type="number" min="1" max="8" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Precio por Asiento (MXN)</label>
          <div class="relative mt-1">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">$</span>
            <input formControlName="price_per_seat" type="number" step="0.50" min="0" placeholder="0.00" class="block w-full pl-7 rounded-md border-gray-300 shadow-sm p-2 border">
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="tripForm.invalid" class="w-full mt-6 bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 disabled:opacity-50 transition-colors">
        Publicar Viaje
      </button>

      <div *ngIf="successMessage" class="mt-4 p-3 bg-green-100 text-green-800 text-center rounded border border-green-200">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-100 text-red-800 text-center rounded border border-red-200">{{ errorMessage }}</div>
    </form>
  </div>
</div>
